InstanceType=OneSix
name=Cogs and Cadavers
notes=Mods update automatically every time you press Play. Do not add or remove mods by hand. Server: stammer-audit.tun.ply.gg
iconKey=default

OverrideMemory=true
MinMemAlloc=4096
MaxMemAlloc=10240

OverrideJavaArgs=true
JvmArgs=-XX:+UseG1GC -XX:MaxGCPauseMillis=50 -XX:+UnlockExperimentalVMOptions -XX:G1NewSizePercent=20 -XX:G1ReservePercent=20 -XX:G1HeapRegionSize=32M -XX:+ParallelRefProcEnabled -XX:+DisableExplicitGC

OverrideCommands=true
PreLaunchCommand="$INST_JAVA" -jar packwiz-installer-bootstrap.jar https://raw.githubusercontent.com/EHtut/MCServer/main/pack/pack.toml

OverrideWindow=false
OverrideConsole=false
