# L2Hostility client display — shipped with the instance.
#
# Ethan, 2026-08-05: "can we get rid of the level indicator from l2?"
#
# The floating "Lv. 14" over every mob is the single loudest piece of UI in the
# pack, and it reads as a stat readout in a world that is trying to be a place.
# The levels still exist and still scale — they simply stop announcing themselves.
#
# These keys live in LHConfig$Client, so they are CLIENT-side: nothing the server
# can set. That is why this has sat in the re-import queue. The spec is flat (no
# [sections]) — verified against LHConfig$Client in l2hostility-3.0.18.jar, which
# calls define()/defineInRange() with no push().
#
# Any key omitted here keeps the mod's own default.

showLevelOverHead = false
showTraitOverHead = false
