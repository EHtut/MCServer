#Configuration file for Raise Sound Limit Simplified
#
#maxSourcesCount was 4095 - the maximum the mod allows - and that is what
#crashed the client on Disconnect, 2026-08-04 20:23:
#
#  IllegalStateException: Tried to release unknown channel
#    at SoundEngine.stopAll -> Minecraft.disconnect -> PauseScreen.onDisconnect
#
#OpenAL Soft realistically provides a few hundred sources. Asking for 4095 means
#most were never actually allocated, so teardown tries to release channels that
#do not exist - which is the error, verbatim.
#
#512 is well above vanilla's limit (the reason to run this mod at all) and well
#inside what the audio device can really give.
maxSourcesCount=512
maxStreamingSources=8
