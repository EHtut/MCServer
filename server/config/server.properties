# ---------------------------------------------------------------------------
# server.properties - TEMPLATE. Copied into the runtime instance by
# server/scripts/setup-server.*; edit it here, not in the instance, or the next
# setup run will overwrite your change.
#
# Tuned for: 4 whitelisted players, ~400 mods, a 16-core desktop-class CPU.
# The settings that are NOT vanilla defaults are commented, because on a modded
# server most of them are the difference between "runs" and "crashes at 3am".
# ---------------------------------------------------------------------------

# --- identity ---------------------------------------------------------------
motd=§8[§6Cogs §8& §4Cadavers§8] §7Industry. Magic. Something in the fog.
server-port=25565
server-ip=

# --- who can join -----------------------------------------------------------
# A private 4-player server. Whitelist ON and ENFORCED: enforce-whitelist kicks
# anyone already connected when they are removed from the list, which is the
# half people forget.
max-players=8
white-list=true
enforce-whitelist=true
online-mode=true
pvp=true
player-idle-timeout=0

# --- difficulty -------------------------------------------------------------
# Hard, because the horror layer is calibrated against it and half the combat
# mods scale their threat off difficulty.
difficulty=hard
gamemode=survival
force-gamemode=false
hardcore=false
spawn-protection=0
allow-nether=true
allow-cheats=false

# --- MODDED-CRITICAL --------------------------------------------------------
# Disable the watchdog. With 400 mods, worldgen or a chunk with a large Create
# contraption can legitimately block the server thread for longer than the
# default 60s, and the watchdog's response is to KILL THE SERVER. On a modded
# pack this setting causes far more crashes than it prevents.
max-tick-time=-1

# Jetpacks, elytra, Create's flying contraptions and several magic mods all
# move the player in ways vanilla's flight check reads as cheating. Without
# this, players are kicked for "flying is not enabled on this server".
allow-flight=true

# Chunk writes off the main thread. Meaningful throughput win; the tradeoff is
# a marginally larger window for corruption on an unclean shutdown, which the
# backup script and a graceful stop both cover.
sync-chunk-writes=false

# Larger packets are common with big modded chunks and inventories.
network-compression-threshold=256

# --- view / simulation ------------------------------------------------------
# view-distance is what players SEE (cheap-ish). simulation-distance is what
# actually TICKS (expensive: entities, redstone, Create machinery). Keeping
# simulation well below view is the single highest-leverage performance dial on
# a modded server. Raise simulation only if spark says you have headroom.
view-distance=12
simulation-distance=8
entity-broadcast-range-percentage=80

# --- world ------------------------------------------------------------------
level-name=world
level-seed=
level-type=minecraft\:normal
generate-structures=true
max-world-size=29999984
spawn-monsters=true
spawn-animals=true
spawn-npcs=true

# --- RCON: the future dungeon master's front door ---------------------------
# Enabled deliberately. RCON is the least invasive way for an external process
# to observe and act on the running world, and it needs no mod. The password is
# generated by setup-server and written to the INSTANCE copy only - it must
# never be committed. Bind RCON to localhost at the firewall; it is a plaintext
# protocol and must not be exposed to the internet.
enable-rcon=true
rcon.port=25575
rcon.password=CHANGE_ME_AT_SETUP
broadcast-rcon-to-ops=false

enable-query=false
enable-status=true
hide-online-players=false
enable-command-block=true
op-permission-level=4
function-permission-level=2
require-resource-pack=false
resource-pack=
resource-pack-sha1=
log-ips=true
prevent-proxy-connections=false
use-native-transport=true
rate-limit=0
text-filtering-config=
